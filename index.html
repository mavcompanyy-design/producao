<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A0B0E">
<title>MAV Produção</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<!-- A entrada fixa do editor: testa os links do MAV Produção (o principal primeiro, depois o reserva) e leva para o que
     abrir. O iMac atualiza o links.json sozinho quando o link reserva muda (app/entrada.py do MAV Produção). -->
<style>
  :root { --fundo: #0A0B0E; --linha: #1C1F26; --texto: #F2F3F5; --suave: #A0A6B0;
          --grad: linear-gradient(135deg, #E8164E 0%, #FF3B4E 55%, #FFC3A6 120%); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--fundo); color: var(--texto); font: 15px/1.5 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
         min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; -webkit-font-smoothing: antialiased; }
  main { width: min(380px, 100%); text-align: center; }
  .logo { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; font-weight: 600;
          letter-spacing: -.01em; white-space: nowrap; }
  .logo b { font-weight: 700; }
  .barras { display: inline-flex; align-items: flex-end; gap: 3px; height: 26px; }
  .barras i { display: block; width: 7px; border-radius: 2px; background: var(--grad); }
  .barras i:nth-child(1) { height: 11px; opacity: .55; }
  .barras i:nth-child(2) { height: 18px; opacity: .8; }
  .barras i:nth-child(3) { height: 26px; }
  .titulo { margin: 36px 0 14px; font-size: 18px; font-weight: 600; }
  .suave { margin: 14px 0 0; color: var(--suave); font-size: 14px; }
  .barra { position: relative; height: 3px; border-radius: 3px; background: var(--linha); overflow: hidden; }
  .barra span { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: var(--grad);
                animation: andar 1.1s ease-in-out infinite; }
  @keyframes andar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .barra span { animation: none; width: 100%; opacity: .6; } }
  button { margin-top: 22px; border: 0; border-radius: 999px; padding: 12px 24px; background: var(--grad); color: #fff;
           font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid #FFC3A6; outline-offset: 3px; }
  a { color: var(--texto); word-break: break-all; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="logo"><span class="barras"><i></i><i></i><i></i></span><span><b>MAV</b> Produção</span></div>

  <section id="abrindo" aria-live="polite">
    <p class="titulo">Abrindo o MAV Produção</p>
    <div class="barra"><span></span></div>
    <p class="suave" id="passo">Procurando o caminho que está funcionando agora.</p>
  </section>

  <section id="falhou" hidden aria-live="polite">
    <p class="titulo">O MAV Produção não abriu agora</p>
    <p class="suave">O iMac do escritório pode estar desligado ou sem internet. Tente de novo daqui a pouco.</p>
    <button id="denovo" type="button">Tentar de novo</button>
  </section>

  <noscript><p class="suave">Ative o JavaScript para entrar, ou abra direto:
    <a href="https://mav-producao.tail5fbea5.ts.net/">mav-producao.tail5fbea5.ts.net</a></p></noscript>
</main>
<script>
(() => {
  "use strict";
  const PADRAO = ["https://mav-producao.tail5fbea5.ts.net"]; // se o links.json não carregar
  const PRAZO = 8000; // quanto cada link tem para responder
  const ESPERA_PRINCIPAL = 2500; // o reserva respondeu primeiro: o principal ainda tem esse tempo antes de ir pelo reserva
  const q = new URLSearchParams(location.search);
  const teste = q.get("teste"); // "reserva": finge que o principal caiu; "nenhum": finge que todos caíram
  const $ = (id) => document.getElementById(id);
  const valido = (l) => typeof l === "string" && /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(l);

  function mostrar(qual, frase) {
    $("abrindo").hidden = qual !== "abrindo";
    $("falhou").hidden = qual !== "falhou";
    if (frase) $("passo").textContent = frase;
    if (qual === "falhou") $("denovo").focus();
  }

  async function lerLinks() {
    try {
      const tempo = new Promise((_, nao) => setTimeout(() => nao(new Error("demorou")), 6000));
      const r = await Promise.race([fetch("links.json?t=" + Date.now(), { cache: "no-store" }), tempo]);
      if (!r.ok) throw new Error(r.status);
      const lista = ((await r.json()).links || []).filter(valido);
      if (lista.length) return lista;
    } catch (e) { /* fica o padrão */ }
    return PADRAO;
  }

  function responde(link) { // o ícone do app abriu = o MAV Produção está no ar por esse link
    return new Promise((ok) => {
      const img = new Image();
      const fim = (v) => { clearTimeout(prazo); img.onload = img.onerror = null; ok(v); };
      const prazo = setTimeout(() => fim(false), PRAZO);
      img.onload = () => fim(img.naturalWidth > 0);
      img.onerror = () => fim(false);
      img.src = link + "/icone.svg?e=" + Date.now();
    });
  }

  function escolher(lista) { // o primeiro que responde; um de baixo só vale se os de cima caíram ou demoraram demais
    return new Promise((ok) => {
      const res = lista.map(() => null);
      let feito = false, graca = 0;
      const decidir = (forcar) => {
        if (feito) return;
        for (let i = 0; i < res.length; i++) {
          if (res[i] === true) { feito = true; clearTimeout(graca); return ok(i); }
          if (res[i] === null && !forcar) return;
        }
        if (!res.includes(null)) { feito = true; clearTimeout(graca); ok(-1); }
      };
      lista.forEach((link, i) => {
        const finge = teste === "nenhum" || (teste === "reserva" && i === 0);
        (finge ? new Promise((v) => setTimeout(() => v(false), 400)) : responde(link)).then((v) => {
          res[i] = v;
          if (v && !graca) graca = setTimeout(() => decidir(true), ESPERA_PRINCIPAL);
          decidir(false);
        });
      });
    });
  }

  async function abrir() {
    mostrar("abrindo", "Procurando o caminho que está funcionando agora.");
    const lista = await lerLinks();
    const i = await escolher(lista);
    if (i < 0) return mostrar("falhou");
    const destino = lista[i] + "/";
    if (q.has("ver")) { // conferência: mostra para onde iria, sem ir
      const a = document.createElement("a");
      a.href = destino; a.textContent = destino;
      const p = $("passo");
      p.textContent = (i === 0 ? "Abriria pelo link principal: " : "Abriria pelo link reserva: ");
      p.appendChild(a);
      return;
    }
    if (i === 0) {
      mostrar("abrindo", "Entrando...");
      location.replace(destino);
      return;
    }
    mostrar("abrindo", "O link principal não respondeu agora. Entrando pelo reserva (ele pode pedir a senha da equipe).");
    setTimeout(() => location.replace(destino), 1800);
  }

  $("denovo").addEventListener("click", abrir);
  addEventListener("pageshow", (e) => { if (e.persisted) abrir(); });
  abrir();
})();
</script>
</body>
</html>
